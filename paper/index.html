<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>paper / aolabs.io</title>
  <meta name="description" content="Cellular Soft Robots manuscript word-movement graph and paper-change queue.">
  <link rel="canonical" href="https://aolabs.io/paper/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AO Labs">
  <meta property="og:title" content="paper / aolabs.io">
  <meta property="og:description" content="Cellular Soft Robots manuscript word-movement graph and paper-change queue.">
  <meta property="og:url" content="https://aolabs.io/paper/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="paper / aolabs.io">
  <meta name="twitter:description" content="Cellular Soft Robots manuscript word-movement graph and paper-change queue.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="suite-header" aria-label="paper navigation">
    <a class="ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
      <img src="/marks/ao-ink.svg" alt="">
    </a>
    <span class="app-mark" aria-hidden="true">
      <img src="./favicon.svg" alt="">
    </span>
    <a class="app-name" href="./">paper</a>
  </header>

  <main>
    <section class="graph-section" aria-labelledby="graph-title">
      <div class="section-head">
        <div>
          <p class="eyebrow">Cellular Soft Robots</p>
          <h1 id="graph-title">daily manuscript word movement</h1>
        </div>
        <p class="source-line" id="sourceLine">loading saved state</p>
      </div>

      <div class="graph-wrap">
        <svg id="wordGraph" role="img" aria-label="Daily added and deleted manuscript words"></svg>
      </div>

      <div class="legend" aria-label="chart legend">
        <span><i class="added"></i> added</span>
        <span><i class="deleted"></i> deleted</span>
        <span id="snapshotSummary">snapshots: --</span>
      </div>
    </section>

    <section class="queue-section" aria-labelledby="queue-title">
      <div class="section-head compact">
        <div>
          <p class="eyebrow">implementation queue</p>
          <h2 id="queue-title">paper changes</h2>
        </div>
        <p class="source-line" id="queueMeta">advisor comments and current manuscript</p>
      </div>
      <div class="task-list" id="taskList"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
