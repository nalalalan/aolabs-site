    </linearGradient>
    <linearGradient id="cream" x1="24" y1="18" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#e5d3bc"/>
    </linearGradient>
    <rect id="ray" x="61" y="12" width="6" height="14" rx="2"/>
