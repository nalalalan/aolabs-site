<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Sandia National Labs inspired ratcheting mechanism icon">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#12110f" flood-opacity=".24"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#fff8eb" flood-opacity=".28"/>
    </filter>
    <linearGradient id="teal" x1="20" y1="18" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fc9c5"/>
      <stop offset=".56" stop-color="#4d8f8b"/>
      <stop offset="1" stop-color="#285f5e"/>
    </linearGradient>
    <linearGradient id="mesa" x1="25" y1="73" x2="110" y2="98" gradientUnits="userSpaceOnUse">
