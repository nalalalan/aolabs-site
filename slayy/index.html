<body>
  <header class="suite-topbar" aria-label="slayy navigation">
    <div class="suite-brand-cluster">
      <a class="suite-ao-home" href="https://aolabs.io/" aria-label="aolabs.io">
        <img src="/marks/ao-ink.svg" alt="">
      </a>
      <a class="suite-app-brand" href="./" aria-label="slayy home">
        <img class="suite-app-mark" src="/icons/slayy.svg?v=20260629" alt="">
        <span class="suite-app-name">slayy</span>
      </a>
    </div>
  </header>

  <main>
    <section class="paper-shell" aria-labelledby="graph-title">
      <div class="section-head section-head-primary">
        <div>
          <h2 id="graph-title">paper graph</h2>
          <p id="paperLine" class="section-meta section-meta-left">checking paper</p>
        </div>
        <div class="top-celebration">
          <button id="manualHypeButton" class="manual-hype-button" type="button">yay celebrate now</button>
          <p id="healthLine" class="section-meta celebrate-status">checking archive</p>
        </div>
      </div>
      <svg id="wordGraph" class="word-graph" role="img" aria-label="daily changed words"></svg>
    </section>

    <section class="paper-version-shell" aria-labelledby="versions-title">
      <div class="section-head">
        <h2 id="versions-title">paper history</h2>
        <p id="versionLine" class="section-meta">checking versions</p>
      </div>
      <ol id="paperVersionList" class="paper-version-list"></ol>
    </section>

    <section class="paper-list-shell" aria-labelledby="changes-title">
      <div class="section-head">
        <h2 id="changes-title">paper changes</h2>
      </div>
      <ol id="paperChangeList" class="paper-change-list"></ol>
    </section>

    <section class="events-shell" aria-label="slayy emails">
      <div class="section-head">
        <h2>hype emails</h2>
      </div>
      <div id="events" class="events"></div>
    </section>
  </main>

  <script>window.SLAYY_API_BASE = "https://slayy.aolabs.io";</script>
  <script src="./app.js?v=20260630q"></script>
</body>
