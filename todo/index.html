<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo archived / aolabs.io</title>
  <link rel="canonical" href="https://aolabs.io/todo/">
  <link rel="icon" href="/favicon.svg?v=20260516-suite-bloom" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3eee6;
      --panel: #fffdf8;
      --ink: #29231f;
      --muted: #746a61;
      --line: rgba(104, 87, 68, .22);
      --accent: #76678d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #e8ded2 0%, var(--bg) 55%, #fbf8f2 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 20px 44px rgba(65, 52, 39, .10), inset 0 1px 0 rgba(255, 255, 255, .78);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 68px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
      font-weight: 650;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: var(--accent);
      font-weight: 850;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>todo archived</h1>
    <p>Not active. Source and data preserved.</p>
    <a href="https://aolabs.io/">aolabs.io</a>
  </main>
</body>
</html>
