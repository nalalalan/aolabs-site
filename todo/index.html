<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://todo.aolabs.io/">
  <title>todo / aolabs.io</title>
  <link rel="canonical" href="https://todo.aolabs.io/">
  <link rel="icon" href="/favicon.svg?v=20260516-suite-bloom" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f1;
      --ink: #26211d;
      --muted: #6e665e;
      --line: rgba(53, 45, 38, .18);
      --accent: #4f6758;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 460px);
      padding: 24px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 760;
    }

    p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      color: var(--accent);
      font-weight: 760;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>todo</h1>
    <p>Active at todo.aolabs.io.</p>
    <a href="https://todo.aolabs.io/">Open todo</a>
  </main>
</body>
</html>
