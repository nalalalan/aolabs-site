<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>todo.aolabs.io</title>
  <meta name="description" content="Fallback route for the password-gated todo list.">
  <link rel="canonical" href="https://aolabs.io/todo/">
  <meta http-equiv="refresh" content="0; url=https://research-app-production-c64e.up.railway.app/">
  <link rel="icon" href="/icons/todo.svg?v=20260525-todo" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f2;
      --panel: #fffefa;
      --ink: #24231f;
      --muted: #686860;
      --line: rgba(48, 49, 44, .16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #eceee8 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(calc(100% - 32px), 420px);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 54px;
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-weight: 720;
    }

    a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      border-radius: 7px;
      background: var(--ink);
      color: var(--panel);
      padding: 8px 14px;
      font-weight: 820;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>todo</h1>
    <p>Opening todo.</p>
    <a href="https://research-app-production-c64e.up.railway.app/">Open todo</a>
  </main>
  <script>window.location.replace("https://research-app-production-c64e.up.railway.app/");</script>
</body>
</html>
